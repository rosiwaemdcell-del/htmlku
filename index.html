<!DOCTYPE html>
<html lang="id">

<head>
 <meta charset='UTF-8' />
 <meta content='width=device-width, initial-scale=1, user-scalable=1, minimum-scale=1, maximum-scale=5'
  name='viewport' />
 <meta content='IE=edge' http-equiv='X-UA-Compatible' />
 <title>Happy Birthday</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
</head>
<style>
 body {
  background-color: #101010;
  font-family: 'Ubuntu', sans-serif;
  padding: 25px
 }

 a {
  text-decoration: none;
 }

 body::before {
  content: "";
  color: white;
  opacity: .3;
  font-size: 5px;
  position: absolute;
  bottom: 25px;
  left: calc(50vw - 30px);
 }

 #bodyblur {
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, .3);
  z-index: -1;
  transition: all 1s ease;
 }

 @keyframes jj {
  0% {
   opacity: .5
  }

  50% {
   opacity: .52
  }

  100% {
   opacity: .5
  }
 }

 #bodyblur img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation-name: jj;
  animation-duration: 3s;
  animation-iteration-count: infinite;
 }

 @keyframes leaves {
  0% {
   transform: scale(1.0);
  }

  100% {
   transform: scale(.8);
  }
 }

 #lope,
 .lopdeg {
  animation: leaves 1s ease-in-out infinite alternate;
  -webkit-animation: leaves 1s ease-in-out infinite alternate;
 }

 .lovein:hover {
  transform: scale(1.3);
 }

 @keyframes kont {
  0% {
   left: -1px;
   top: 0;
  }

  50% {
   left: 1px;
   top: 0px;
  }

  100% {
   left: -1px;
   top: 0px;
  }
 }

 blockquote {
  animation-name: kont;
  animation-duration: 3s;
  animation-iteration-count: infinite;
  position: relative;
  opacity: .8;
  margin-left: 0;
  margin-right: 0;
 }

 blockquote {
  max-width: 400px;
  width: 100%;
  box-sizing: border-box;
  color: #fff;
  font-size: 15px;
  font-weight: 400;
  text-align: center;
  padding: 30px 30px 30px 30px;
  border: 1px dashed #fff;
  border-radius: 18px;
 }

 blockquote p:first-child {
  font-size: 18px;
  font-weight: 700;
 }

 .lovein {
  font-size: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all .3s ease;
 }

 .lovein svg {
  width: 80px;
  height: 80px;
  fill: #fefefe
 }

 .content2 {
  display: block;
  text-align: center;
  width: 100%;
  height: 180px;
  margin-top: 50px;
 }

 .content2>* {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 15px;
  font-size: 17px;
  color: white
 }

 .image img {
  border-radius: 10%;
  transition: all .5s ease;
 }

 .foto img:first-child {
  z-index: 1
 }

 .content2 {
  display: none;
 }

 #Content {
  opacity: 0;
  margin-top: 50px;
  width: 100%;
  min-height: 180px;
  transition: all .3s ease;
 }

 #Content>* {
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 15px;
  font-size: 17px;
  color: white
 }

 #tlink {
  display: none;
  color: #FFEE93;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 1px;
  cursor: pointer;
  padding: 12px 30px;
  margin-top: 20px;
  border: 2px solid rgba(255, 238, 147, 0.6);
  border-radius: 50px;
  background: rgba(255, 238, 147, 0.1);
  text-shadow: 0 0 10px rgba(255, 238, 147, 0.5);
  box-shadow: 0 0 15px rgba(255, 238, 147, 0.2), inset 0 0 15px rgba(255, 238, 147, 0.05);
  transition: all .4s ease;
  animation: tlinkPulse 2s ease-in-out infinite;
 }

 @keyframes tlinkPulse {

  0%,
  100% {
   box-shadow: 0 0 15px rgba(255, 238, 147, 0.2), inset 0 0 15px rgba(255, 238, 147, 0.05);
   text-shadow: 0 0 10px rgba(255, 238, 147, 0.5);
  }

  50% {
   box-shadow: 0 0 25px rgba(255, 238, 147, 0.5), inset 0 0 20px rgba(255, 238, 147, 0.1);
   text-shadow: 0 0 20px rgba(255, 238, 147, 0.8);
  }
 }

 #tlink:hover {
  transform: scale(1.08);
  background: rgba(255, 238, 147, 0.2);
  border-color: rgba(255, 238, 147, 0.9);
  box-shadow: 0 0 30px rgba(255, 238, 147, 0.6), inset 0 0 20px rgba(255, 238, 147, 0.15);
 }

 #tlink:active {
  transform: scale(0.95);
 }

 .swal2-title {
  font-size: 18px;
  text-align: center;
  padding: 15px 30px 0 30px;
 }

 .swal2-modal {
  background: rgba(255, 255, 255, .99);
  border: .7px solid #000;
  border-radius: 25px;
 }
</style>

<body>
 <div id="bodyblur"><img src="img/Background.jpg" width="100%" height="100%" />
 </div>

 <div id='Content'>
  <div class="image"><img src="img/gumush.gif" width="130px" height="130px" /></div>
  <div>
   <blockquote>
    <p id="text"></p>
    <p id="text2"></p>
    <p id="text3"></p>
    <p id="text4"></p>
    <p id="text5"></p>
    <p onClick="popup();" id="tlink">Klik Ini Dong!</p>
   </blockquote>
  </div>
 </div>

 <div id="tombo" class="content2">
  <div id="lope" class="ct1"><label class='lovein' onClick="showDiv();nonTo();">&#10084;&#65039;</label></div>
  <p style="opacity:.7;font-size:12px;color:white">Sentuh LOVE di atas</p>
 </div>

 <script>
  function nonTo() { document.getElementById('tombo').style.display = "none"; } function showTo() { document.getElementById('tombo').style.display = "block"; }
  function nonFo() { document.getElementById('idfoto').style.display = "none"; } function showFo() { document.getElementById('idfoto').style.display = "block"; }
  function nonDiv() { document.getElementById('Content').style.display = "none"; }
  var sudahTampil = false;
  function showDiv() { if (sudahTampil) return; sudahTampil = true; ketik(); document.getElementById('Content').style.opacity = "1"; document.getElementById('Content').style.margin = "0"; }

  var i = 0, text; text = ""
  var u = 0, text2; text2 = ""
  var v = 0, text3; text3 = ""
  var w = 0, text4; text4 = ""
  var x = 0, text5; text5 = ""

  function ketik() {
   if (i < text.length) { document.getElementById("text").innerHTML += text.charAt(i); i++; setTimeout(ketik, 50); }
   else if (i == text.length) { document.getElementById("text").innerHTML = text + emotnama; ketikk(); }
  }
  function ketikk() {
   if (u < text2.length) { document.getElementById("text2").innerHTML += text2.charAt(u); u++; setTimeout(ketikk, 40); }
   else if (u == text2.length) {
    ketik3();
   }
  }
  function ketik3() {
   if (v < text3.length) { document.getElementById("text3").innerHTML += text3.charAt(v); v++; setTimeout(ketik3, 40); }
   else if (v == text3.length) {
    ketik4();
   }
  }
  function ketik4() {
   if (w < text4.length) { document.getElementById("text4").innerHTML += text4.charAt(w); w++; setTimeout(ketik4, 30); }
   else if (w == text4.length) {
    ketik5();
   }
  }
  function ketik5() {
   if (x < text5.length) { document.getElementById("text5").innerHTML += text5.charAt(x); x++; setTimeout(ketik5, 40); }
   else if (x == text5.length) {
    document.getElementById('tlink').style.display = "block";
   }
  }
 </script>

   text5 = "🎂💗🥰 Selamat ulang tahun, sayangku yang paling aku cintai. Semoga makin bahagia, makin sukses, makin sehat, dan makin sayang sama aku, hehe. 🤭❤️ Jangan lupa bahagia ya, karena senyummu adalah salah satu hal favoritku. Terima kasih sudah hadir dan membuat hari-hariku lebih berwarna. Pokoknya, doa terbaik selalu untukmu. Love you so much, babyyy! 💋💞 ";
   pilihwarna();

  mulaitanya();
 </script>
